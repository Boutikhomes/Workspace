<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เลือกโครงการก่อสร้าง</title>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --line: #dbe4f0;
        --panel: #ffffff;
        --page: #f6f8fb;
        --nav: #0b1f3a;
        --blue: #123f73;
        --blue-soft: #eaf1f8;
        --shadow: 0 18px 42px rgba(11, 31, 58, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: var(--page);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .page {
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding: 42px 0 64px;
      }

      .hero {
        padding: 8px 0 28px;
        margin-bottom: 4px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--blue);
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        color: var(--nav);
        font-size: clamp(2.25rem, 4vw, 3.4rem);
        line-height: 1.15;
      }

      .lead {
        max-width: 760px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .project-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        padding: 22px;
        border-radius: 8px;
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      h2 {
        margin: 0;
        color: var(--nav);
        font-size: 1.25rem;
      }

      .badge {
        border: 1px solid #c9d8ea;
        background: var(--blue-soft);
        color: var(--blue);
        padding: 7px 10px;
        font-size: 0.86rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .project-card {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        padding: 0;
        text-align: left;
        display: grid;
        overflow: hidden;
        min-height: 300px;
        border-radius: 8px;
        box-shadow: none;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .project-card:hover,
      .project-card:focus-visible {
        border-color: var(--blue);
        box-shadow: 0 16px 32px rgba(11, 31, 58, 0.12);
        transform: translateY(-2px);
        outline: none;
      }

      .photo-slot {
        display: grid;
        place-items: center;
        min-height: 172px;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(90deg, rgba(18, 63, 115, 0.08) 1px, transparent 1px),
          linear-gradient(180deg, rgba(18, 63, 115, 0.08) 1px, transparent 1px),
          #eef4fa;
        background-size: 28px 28px;
        color: var(--muted);
        font-weight: 800;
        text-align: center;
        padding: 16px;
      }

      .project-body {
        padding: 16px;
      }

      h3 {
        margin: 0;
        color: var(--nav);
        font-size: 1.08rem;
      }

      .project-body p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      @media (max-width: 900px) {
        .project-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .page {
          width: min(100% - 28px, 1180px);
          padding-top: 18px;
        }

        .section-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .badge {
          width: 100%;
        }

        .project-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">ฝ่ายก่อสร้าง</p>
        <h1>เลือกโครงการ</h1>
        <p class="lead">เลือกโครงการก่อนเพื่อเข้าสู่หน้า dashboard ก่อสร้างของโครงการนั้น หน้านี้มีหน้าที่เลือกโครงการอย่างเดียว</p>
      </section>

      <section class="project-panel" aria-label="เลือกโครงการก่อสร้าง">
        <div class="section-head">
          <div>
            <p class="eyebrow">Select Project</p>
            <h2>โครงการทั้งหมด</h2>
          </div>
          <span class="badge">ช่องรูปจะลิงก์จากหน้า Workspace Dashboard</span>
        </div>

        <div class="project-grid">
          <button class="project-card" type="button" data-project="samaedam">
            <div class="photo-slot">รอรูปโครงการจาก Workspace Dashboard</div>
            <div class="project-body">
              <h3>โครงการเวอร์โซ่ แสมดำ</h3>
              <p>เข้าสู่ dashboard งานก่อสร้างของ Verzo Samaedam</p>
            </div>
          </button>

          <button class="project-card" type="button" data-project="valley">
            <div class="photo-slot">รอรูปโครงการจาก Workspace Dashboard</div>
            <div class="project-body">
              <h3>โครงการเวอร์โซ่ วัลเลย์</h3>
              <p>เข้าสู่ dashboard งานก่อสร้างของ Verzo Valley</p>
            </div>
          </button>

          <button class="project-card" type="button" data-project="viaste">
            <div class="photo-slot">รอรูปโครงการจาก Workspace Dashboard</div>
            <div class="project-body">
              <h3>โครงการเวียสเต้ พระราม 2</h3>
              <p>เข้าสู่ dashboard งานก่อสร้างของ Viaste Rama 2</p>
            </div>
          </button>
        </div>
      </section>
    </main>

    <script>
      const dashboardUrls = {
        samaedam: "#dashboard-samaedam",
        valley: "#dashboard-valley",
        viaste: "#dashboard-viaste",
      };

      document.querySelectorAll("[data-project]").forEach((button) => {
        button.addEventListener("click", () => {
          window.location.href = dashboardUrls[button.dataset.project];
        });
      });
    </script>
  </body>
</html>
