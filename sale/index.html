<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutikhomes Sales Workspace</title>
  <meta name="description" content="ระบบฝ่ายขาย Boutikhomes สำหรับผังโครงการ Lead Walk-in Follow up และเป้าขาย">
  <style>
    :root {
      --bg: #f4f7f8;
      --panel: #ffffff;
      --panel-soft: #f7faf9;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d8e2e4;
      --brand: #0f766e;
      --brand-deep: #134e4a;
      --blue: #2563eb;
      --amber: #b45309;
      --green: #15803d;
      --slate: #64748b;
      --rose: #be123c;
      --shadow: 0 14px 38px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(15, 118, 110, 0.1), rgba(244, 247, 248, 0) 360px),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Helvetica Neue", Arial, sans-serif;
    }

    a { color: inherit; }

    .hidden { display: none !important; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 20px;
      flex: 0 0 auto;
    }

    .brand-lockup strong {
      display: block;
      color: var(--brand-deep);
      font-size: 18px;
      white-space: nowrap;
    }

    .brand-lockup span {
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
